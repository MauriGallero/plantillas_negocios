<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RULO - Barbería Clásica</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0E0E;color:#EDE8DF;font-family:'Inter',sans-serif}
h1,h2{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:0.02em}
.wrap{max-width:1200px;margin:0 auto;padding:24px}
.nav{display:flex;justify-content:space-between;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;opacity:0.6}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px;align-items:end}
.hero h1{font-size:92px;line-height:0.9}
.hero-img{height:72vh;min-height:500px;background:url('RULO.jpg') center/cover;border-radius:4px;filter:grayscale(0.1)}
.btn{background:#EDE8DF;color:#0E0E0E;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:600;display:inline-block;margin-top:20px;font-size:14px}
.prices{margin-top:56px;border-top:1px solid #222;padding-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.prices div{border-left:1px solid #222;padding-left:16px}
.prices b{display:block;font-family:'Anton';font-size:20px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero h1{font-size:56px}.hero-img{height:50vh}.prices{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><span>RULO — Moreno Centro</span><span>Lun a Sáb 10-20hs</span></div>
  <div class="hero">
    <div><h1>CORTE<br>CLÁSICO<br>Y BARBA.</h1><p style="margin-top:16px;opacity:0.7;max-width:340px">Tijera, navaja y charla. Reservá tu turno por WhatsApp.</p><a class="btn" href="https://wa.me/5491130497635?text=Hola%20Rulo,%20quiero%20un%20turno">Reservar turno →</a></div>
    <div class="hero-img"></div> 
    </div>
  <img src="BARBER.jpg>
  <div class="prices">
    <div><b>$8.000</b>Corte</div>
    <div><b>$12.000</b>Corte + Barba</div>
    <div><b>$5.000</b>Barba</div>
    <div><b>$6.000</b>Niños</div>
  </div>
</div>
</body>
</html>
